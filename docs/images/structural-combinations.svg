<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="430" viewBox="0 0 1050 430" role="img" aria-labelledby="title desc"><title id="title">Experiment with structural combinations</title><desc id="desc">Three front-view schematics show shared widths between thick pillars and wall posts, thick and thin pillars, and thin pillars and support beams.</desc><rect width="1050" height="430" fill="#f6f1e7"/><g font-family="sans-serif" fill="#302b24"><text x="30" y="38" font-size="24">Structural block combinations</text><text x="30" y="65" font-size="14">Front-view schematics • shared proportions, simplified connections</text><text x="175" y="108" text-anchor="middle" font-size="19">Wall + thick pillar</text><rect x="143" y="244" width="64" height="96" fill="#b78b50" stroke="#58422a" stroke-width="2"/><rect x="119" y="316" width="112" height="24" fill="#d5ad70" stroke="#58422a" stroke-width="2"/><rect x="143" y="148" width="64" height="96" fill="#87643c" stroke="#58422a" stroke-width="2"/><path d="M85 244H265" stroke="#746b5d" stroke-dasharray="4 5"/><text x="175" y="380" text-anchor="middle" font-size="14">Continue the eight-pixel core.</text><text x="525" y="108" text-anchor="middle" font-size="19">Thin + thick pillar</text><rect x="493" y="244" width="64" height="96" fill="#b78b50" stroke="#58422a" stroke-width="2"/><rect x="469" y="316" width="112" height="24" fill="#d5ad70" stroke="#58422a" stroke-width="2"/><rect x="509" y="148" width="32" height="96" fill="#87643c" stroke="#58422a" stroke-width="2"/><rect x="493" y="226" width="64" height="18" fill="#d5ad70" stroke="#58422a" stroke-width="2"/><rect x="493" y="148" width="64" height="18" fill="#d5ad70" stroke="#58422a" stroke-width="2"/><path d="M435 244H615" stroke="#746b5d" stroke-dasharray="4 5"/><text x="525" y="380" text-anchor="middle" font-size="14">The thin pillar base matches the thick core.</text><text x="875" y="108" text-anchor="middle" font-size="19">Beam + thin pillar</text><rect x="859" y="244" width="32" height="96" fill="#b78b50" stroke="#58422a" stroke-width="2"/><rect x="843" y="328" width="64" height="12" fill="#d5ad70" stroke="#58422a" stroke-width="2"/><rect x="859" y="148" width="32" height="96" fill="#87643c" stroke="#58422a" stroke-width="2"/><path d="M785 244H965" stroke="#746b5d" stroke-dasharray="4 5"/><text x="875" y="380" text-anchor="middle" font-size="14">Continue the four-pixel core.</text></g></svg>