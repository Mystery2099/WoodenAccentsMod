import me.modmuss50.mpp.ReleaseType
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "$loom_version"
	id "me.modmuss50.mod-publish-plugin" version "$mod_publish_version"
	id "org.jetbrains.kotlin.jvm" version "$kotlin_version"
}

version = "${project.mod_version}"
group = "${project.maven_group}"

def releaseChangelog = providers.fileContents(layout.projectDirectory.file("CHANGELOG.md")).asText.map { changelog ->
	def releaseHeading = "## [${project.version}]"
	def changelogLines = changelog.readLines()
	def sectionStart = changelogLines.findIndexOf { line ->
		line == releaseHeading || line.startsWith("${releaseHeading} - ")
	}

	if (sectionStart < 0) {
		throw new GradleException("CHANGELOG.md does not contain a section for version ${project.version}")
	}

	def followingLines = changelogLines.subList(sectionStart + 1, changelogLines.size())
	def relativeSectionEnd = followingLines.findIndexOf { line -> line.startsWith("## [") }
	def sectionEnd = relativeSectionEnd < 0 ? changelogLines.size() : sectionStart + 1 + relativeSectionEnd
	def releaseNotes = changelogLines.subList(sectionStart + 1, sectionEnd).join("\n").trim()

	if (releaseNotes.isEmpty()) {
		throw new GradleException("CHANGELOG.md section for version ${project.version} is empty")
	}

	return releaseNotes
}

def releaseType = providers.gradleProperty("releaseType").orElse("STABLE").map { configuredType ->
	try {
		return ReleaseType.valueOf(configuredType.toUpperCase(Locale.ROOT))
	} catch (IllegalArgumentException ignored) {
		throw new GradleException("Unsupported release type '${configuredType}'. Expected STABLE, BETA, or ALPHA.")
	}
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = uri("https://maven.misterpemodder.com/libs-release/") }
	maven { url = uri("https://maven.shedaniel.me/") }
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = uri("https://api.modrinth.com/maven")
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
    splitEnvironmentSourceSets()

	mods {
		"wooden_accents_mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
    runs {
		// This adds a new gradle task that runs the datagen API: "gradlew runDatagen"
		datagen {
			inherit server
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=$archives_base_name"

			runDir "build/datagen"
		}
	}
}

// Add the generated resources to the main source set
sourceSets {
	main {
		resources {
			srcDirs += [
					'src/main/generated'
			]
			exclude '.cache/**'
		}
	}
}
dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	// Uncomment the following line to enable the deprecated Fabric API modules.
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
	modImplementation("com.misterpemodder:shulkerboxtooltip-fabric:${project.shulker_box_tooltip_version}") { transitive = false }
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modImplementation "maven.modrinth:voxlib:${project.voxlib_version}"
	// Loom's development remap drops VoxLib's nested-jar declaration, so provide its embedded library at runtime.
	runtimeOnly("com.github.ben-manes.caffeine:caffeine:${project.caffeine_version}") {
		exclude(group: "org.checkerframework", module: "checker-qual")
		exclude(group: "com.google.errorprone", module: "error_prone_annotations")
	}
}

processResources {
	def projectVersion = version
	inputs.property "version", projectVersion

	filesMatching("fabric.mod.json") {
		expand "version": projectVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release.set(17)
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_17
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${archives_base_name}"}
	}
}

publishMods {
	file = remapJar.archiveFile
	changelog = releaseChangelog
	type = releaseType
	displayName = "Wooden Accents Mod ${project.version}"
	modLoaders.add("fabric")
	dryRun = providers.gradleProperty("dryRun").map { it.toBoolean() }.orElse(false)

	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = "Mystery2099/WoodenAccentsMod"
		commitish = providers.environmentVariable("GITHUB_SHA").orElse("master")
		tagName = "v${project.version}"
		additionalFiles.from(remapSourcesJar.archiveFile)
	}
}
